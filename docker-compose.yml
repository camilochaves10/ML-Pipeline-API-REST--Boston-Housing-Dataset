services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: housing_pipeline
    command: python -m src.train
    environment:
      - MLFLOW_TRACKING_URI=file:/app/mlflow_data
      - GIT_PYTHON_REFRESH=quiet
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow_data:/app/mlflow_data
    depends_on:
      - mlflow 
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: housing_mlflow
    command: >
      mlflow ui
      --host 0.0.0.0
      --port 5000
      --backend-store-uri file:/mlflow_data
    ports:
      - "5050:5000"
    volumes:
      - ./mlflow_data:/mlflow_data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: housing_api
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      pipeline:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: housing_streamlit
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      pipeline:
        condition: service_completed_successfully
      api:
        condition: service_started